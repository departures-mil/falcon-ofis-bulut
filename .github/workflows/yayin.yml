name: Güncelleme yayını
on:
  push:
    branches: [main]
    paths: ['yayin/kuyruk/**']
  workflow_dispatch:
concurrency:
  group: yayin
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri Firebase'e yayınla
        run: node yayin/yayinla.js
        env:
          FALCON_EMAIL: yonetici@example.invalid
          FALCON_PASSWORD: ${{ secrets.FALCON_PASSWORD }}
      - name: Kuyruğu temizle
        if: always()
        run: |
          git config user.name "falcon-yayin"
          git config user.email "falcon-yayin@users.noreply.github.com"
          git add -A yayin
          git diff --cached --quiet || git commit -m "Yayın sonucu" && git push || true
