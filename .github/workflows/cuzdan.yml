name: Cüzdan izleyici
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: cuzdan
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Kayıt defterini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: veri/falcon.db.enc
          key: falcon-veri-${{ github.run_id }}
          restore-keys: falcon-veri-
      - name: Cüzdanları kontrol et ve eşitle
        run: node run.js
        env:
          FALCON_PASSWORD: ${{ secrets.FALCON_PASSWORD }}
          # İsteğe bağlı: tanımlıysa hata ve yeni hareket Telegram'a bildirilir (tutar / adres yazılmaz)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Kayıt defterini sakla
        if: always() && hashFiles('veri/falcon.db.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: veri/falcon.db.enc
          key: falcon-veri-${{ github.run_id }}
